specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ERC20Proxy
    network: boba
    source:
      address: "0x5079FE74b3888dE1B2b2deeCF1751E3759e4bd72"
      abi: ERC20Proxy
      startBlock: 32880247
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Payment
      abis:
        - name: ERC20Proxy
          file: ./abis/ERC20Proxy.json
      eventHandlers:
        - event: TransferWithReference(address,address,uint256,indexed bytes)
          handler: handleTransferWithReference
          receipt: true
      file: ./src/erc20Proxy.ts
